name: Draft Release

on:
  workflow_run:
    workflows:
      - CI Build
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  create-draft-release:
    name: Create draft release from CI artifacts
    permissions:
      contents: write
      actions: read
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest

    steps:
      - name: Check out built revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve release tag and state
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"

          if [[ -z "${current_version}" ]]; then
            echo "Could not determine current Cargo.toml version" >&2
            exit 1
          fi

          tag="v${current_version}"
          release_state=missing
          if is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            case "$is_draft" in
              true)
                release_state=draft
                ;;
              false)
                release_state=published
                ;;
              *)
                echo "Unexpected draft state for ${tag}: ${is_draft}" >&2
                exit 1
                ;;
            esac
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_state=${release_state}" >> "$GITHUB_OUTPUT"

      - name: Download binary artifacts from CI Build run
        if: steps.version.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          mapfile -t artifact_ids < <(
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("release-")) | .id'
          )

          if [[ ${#artifact_ids[@]} -eq 0 ]]; then
            echo "No release-* artifacts found on run ${RUN_ID}" >&2
            exit 1
          fi

          for id in "${artifact_ids[@]}"; do
            zip_path="artifact-${id}.zip"
            gh api "repos/${REPO}/actions/artifacts/${id}/zip" > "${zip_path}"
            unzip -o "${zip_path}" -d dist
            rm -f "${zip_path}"
          done

      - name: Ensure Unix binaries are executable
        if: steps.version.outputs.release_state != 'published'
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          for path in dist/*; do
            if [[ -f "$path" && "$path" != *.exe ]]; then
              chmod 755 "$path"
            fi
          done

      - name: Validate complete binary set
        if: steps.version.outputs.release_state != 'published'
        shell: bash
        run: |
          set -euo pipefail

          required_binaries=(
            stack-x86_64-unknown-linux-gnu
            stack-x86_64-apple-darwin
            stack-aarch64-apple-darwin
            stack-x86_64-pc-windows-msvc.exe
          )
          for binary in "${required_binaries[@]}"; do
            if [[ ! -f "dist/${binary}" ]]; then
              echo "Required release binary is missing: ${binary}" >&2
              exit 1
            fi
          done

      - name: Create draft release if missing
        if: steps.version.outputs.release_state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          title="$tag"

          gh release create "$tag" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --draft \
            --title "$title" \
            --generate-notes

      - name: Attach or refresh draft binaries
        if: steps.version.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          gh release upload "$tag" dist/* --clobber
